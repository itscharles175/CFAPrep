[package]
name = "app"
version = "0.9.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
base64 = "0.22"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
log = "0.4"
getrandom = "0.2"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# NATIVE-2 — single-instance guard. A second launch of StudyVault must NOT spawn
# a duplicate set of sidecars (which would fight over the owned ports); instead it
# forwards its argv to the already-running instance and exits. v2.4.2 resolves +
# compiles fully offline against the pinned tauri 2.11 (verified), so this is a
# no-network add consistent with the offline invariant.
tauri-plugin-single-instance = "2.4.2"

# NATIVE-1 — crash-safe sidecar lifecycle. On Windows, a Job Object with
# JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE reaps every assigned sidecar when the app
# (and its last Job handle) dies — even on an uncatchable SIGKILL — so no
# orphaned sidecar can keep squatting an owned port. The exact `windows`
# version (0.61.3) is already pinned in Cargo.lock transitively via `tauri`, so
# this is a no-network add. Only the JobObjects + Threading + Foundation API
# areas are enabled to keep the build slim.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # CreateJobObjectW's signature references SECURITY_ATTRIBUTES (gated behind
    # Win32_Security), so the JobObjects creation call needs this enabled.
    "Win32_Security",
    # GAP-SEC-1 — Windows Credential Manager (CredRead/Write/DeleteW + CREDENTIALW)
    # for OS-keychain custody of the opt-in secure-vault key. Same pinned
    # windows 0.61.3 already in Cargo.lock, so this feature add is no-network.
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# NATIVE-1 (Unix path) — set PR_SET_PDEATHSIG on each spawned child via prctl so
# a child receives SIGKILL when the supervising app dies, mirroring the Windows
# Job Object kill-on-close semantics. `libc` 0.2 is already in Cargo.lock
# transitively, so this is also a no-network add.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
