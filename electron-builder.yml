appId: com.studyvault.app
productName: StudyVault
copyright: Copyright StudyVault contributors. Personal use only.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
afterPack: scripts/apply-electron-fuses.mjs
npmRebuild: false
forceCodeSigning: true
directories:
  output: release
  buildResources: electron/assets
files:
  - dist/**/*
  - electron/**/*
  - package.json
  # The main process imports only node builtins + electron; every production
  # dependency is renderer-only and is already bundled into dist/ by Vite.
  # electron-builder otherwise walks the production tree into app.asar (~318 MB).
  - '!node_modules/**/*'
  # Verify/CI artifacts written under dist/ (coverage, junit, stack-doctor
  # report) — build output, not shipped app content, and they embed local paths.
  - '!dist/reports/**/*'
  - '!electron/tests/**/*'
  - '!electron/resources/**/*'
extraResources:
  - from: electron/resources/services
    to: services
    filter:
      - '**/*'
protocols:
  - name: StudyVault
    schemes:
      - studyvault
fileAssociations:
  - ext:
      - pdf
      - txt
    name: Study document
    role: Viewer
win:
  icon: electron/assets/icon.ico
  target:
    - nsis
    - msi
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    publisherName: StudyVault
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StudyVault
mac:
  icon: electron/assets/icon.icns
  target:
    - dmg
  category: public.app-category.education
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  notarize: true
dmg:
  sign: true
linux:
  icon: electron/assets
  target:
    - AppImage
    - deb
  category: Education
  maintainer: StudyVault
publish: null
