<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantVault Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1120;
        color: #f1f5f9;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 520px;
        padding: 32px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 16px;
        background: rgba(30, 41, 59, 0.72);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        color: #cbd5e1;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        color: #60a5fa;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>QuantVault is offline</h1>
      <p>
        Cached lessons and tools will reopen when they are available locally. Reconnect to refresh the app shell,
        sync the latest cache, or load routes you have not visited on this device.
      </p>
      <a href="/">Return to the vault</a>
    </main>
  </body>
</html>
