# Release workflow — triggered on v* tag push.
# Runs the verify gate, then builds signed Tauri bundles on Windows, macOS,
# and Linux in parallel, and uploads them as Release assets.
#
# Sidecar matrix (OPS-5) — required vs optional:
#
#   | Sidecar             | Tier      | Source                         | Build gate                          | If absent at runtime                       |
#   | ------------------- | --------- | ------------------------------ | ----------------------------------- | ------------------------------------------ |
#   | LSAT backend (8100) | REQUIRED  | committed services/lsat-backend| always built + smoke-tested + bundle-verified | release FAILS the build (never ships broken) |
#   | SurrealDB (8000)    | REQUIRED* | vendored binary under spike/bin| not frozen here (native binary)     | open-notebook stack can't come up          |
#   | open-notebook (5055)| OPTIONAL  | external clone via ONB_GIT_URL | built ONLY when ONB_GIT_URL is set  | supervisor SKIPS it; app degrades (RAG off)|
#   | open-notebook worker| OPTIONAL  | (ships with open-notebook)     | bundled with the open-notebook resource | supervisor SKIPS it (paired with the API)  |
#
#   *SurrealDB is required for RAG but is only present when the open-notebook
#    resource is; a RAG-less build ships neither and the Rust supervisor
#    (build_sidecar_specs) marks the open-notebook API + worker `optional` so
#    their absence is a graceful degrade, not an error.
#
#   A RAG-less build is therefore a DELIBERATE, LABELLED artifact: when the
#   ONB_GIT_URL repo variable is unset the open-notebook build step is skipped
#   with a loud ::warning::, the build summary records "RAG: OFF", and the
#   uploaded bundle's artifact name is suffixed `-norag` so it's unmistakable
#   in the Release assets. Set ONB_GIT_URL and full-SHA ONB_GIT_REF to ship a
#   full RAG-enabled build.

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (web build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci --legacy-peer-deps
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Provision LSAT backend venv
        run: |
          python -m venv .venv-lsat
          .venv-lsat/bin/python -m pip install --upgrade pip wheel
          .venv-lsat/bin/python -m pip install "services/lsat-backend"

      - name: Verify release tag matches app version
        run: npm run check:versions -- --git-tag

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run typecheck:lsat
      - run: npm test
      - run: npm run test:lsat:ci
      - run: npm run build
      - run: npm run bundle:report
      - run: npm run perf:regression
      - run: npm run content:validate
      - run: npm run check:no-egress
      - run: npm run check:sidecar-fetches
      - run: npm run check:docs
      - run: npm run vault-archive:drill
      - name: Prompt regression fixture floor
        run: |
          node --import ./scripts/register-ts-loader.mjs scripts/prompt-regression-fixture-floor.mjs
          (cd services/lsat-backend && ../../.venv-lsat/bin/python -m app.prompt_contracts --check)
      - name: RAG retrieval-eval floor
        run: node --import ./scripts/register-ts-loader.mjs scripts/rag-eval.mjs
      - name: Citation faithfulness floor
        run: node --import ./scripts/register-ts-loader.mjs scripts/citation-faithfulness-eval.mjs
      - name: Source-grounded answer benchmark floor
        run: node --import ./scripts/register-ts-loader.mjs scripts/source-grounded-answer-eval.mjs
      - name: Generated content gate floor
        run: node --import ./scripts/register-ts-loader.mjs scripts/generated-content-gate-eval.mjs
      - name: Generation quality regression floor
        working-directory: services/lsat-backend
        env:
          LSATLAB_DATA_DIR: ${{ runner.temp }}/lsat-generation-gate
        run: |
          ../../.venv-lsat/bin/python - <<'PY'
          from sqlmodel import Session
          from app.db import engine, init_db
          from app import jobs

          init_db()
          with Session(engine) as session:
              result = jobs.run_generation_gate_eval(session, notes="github_release_verify")
          metrics = result["metrics"]
          assert result["status"] == "ok", result
          assert metrics["generation_quality_cases"] >= 3, metrics
          assert metrics["generation_quality_failed_cases"] == 0.0, metrics
          assert metrics["generation_quality_clean_pass"] >= 1.0, metrics
          assert metrics["generation_quality_trap_metadata_rejected"] >= 1.0, metrics
          assert metrics["generation_quality_weak_distractor_rejected"] >= 1.0, metrics
          print(result["kind"], result["status"], metrics["generation_quality_cases"])
          PY
      - name: Explanation golden floor
        working-directory: services/lsat-backend
        env:
          LSATLAB_DATA_DIR: ${{ runner.temp }}/lsat-explanation-gate
        run: ../../.venv-lsat/bin/python -m app.eval --release-floor --check --seed
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Tauri bundle — ${{ matrix.os }}
    needs: verify
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-args: ''
            artifact-glob: 'src-tauri/target/release/bundle/{deb,appimage}/*'
          - os: windows-latest
            target-args: ''
            artifact-glob: 'src-tauri/target/release/bundle/{msi,nsis}/*'
          - os: macos-latest
            target-args: '--target universal-apple-darwin'
            artifact-glob: 'src-tauri/target/universal-apple-darwin/release/bundle/{dmg,macos}/*'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux-only: install the system packages Tauri needs (webkit2gtk, etc.)
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # macOS-only: install both rustc targets for the universal binary.
      - name: Add macOS rustc targets
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - run: npm ci --legacy-peer-deps

      # --- Backend sidecars (Plan P3 / P4) -----------------------------------
      # PyInstaller binaries are platform-native, so each must be frozen on the
      # SAME runner OS that builds the Tauri bundle (they can't be built once and
      # shared). Without this, `tauri build` happily bundles an empty
      # resources/services/ dir → a tagged release that ships with no working
      # backend. This is the single biggest release-correctness risk.
      - name: Set up Python (sidecar builds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # LSAT backend: source is committed (services/lsat-backend) → always built.
      - name: Build LSAT backend sidecar
        run: npm run build:lsat-binary

      # P4: boot the frozen binary on a throwaway port and assert /api/health →
      # {ok:true}. Catches a missed PyInstaller hidden-import (builds fine, dies
      # at boot) that bundling alone would never surface. LSATLAB_DATA_DIR points
      # at a runner-temp dir so the first-run SQLite create can't fail on perms.
      - name: Smoke-test LSAT backend sidecar
        shell: bash
        env:
          LSATLAB_DATA_DIR: ${{ runner.temp }}/lsat-smoke
        run: |
          node scripts/smoke-sidecar.mjs \
            --bin src-tauri/resources/services/lsat-backend/lsatlab-backend \
            --url http://127.0.0.1:8123/api/health \
            --expect-ok --timeout 90000 --label lsat-backend \
            -- --host 127.0.0.1 --port 8123

      # open-notebook (RAG): an external project living in gitignored spike/, so
      # there is no committed source to build from. OPTIONAL sidecar (OPS-5):
      # built ONLY when a clone source is configured via the ONB_GIT_URL +
      # full-SHA ONB_GIT_REF repo variables; otherwise the release is a
      # DELIBERATE RAG-less artifact and says so loudly. The Rust supervisor
      # (build_sidecar_specs) marks the open-notebook API + worker `optional`, so
      # a bundle without the open-notebook resource degrades gracefully (RAG
      # off) at runtime instead of erroring. (No HTTP smoke here — its health
      # route isn't pinned in-repo.) Emits `rag_enabled` for the summary +
      # artifact-name suffix downstream so the RAG-less build is clearly labelled.
      - name: Build open-notebook sidecar (optional)
        id: onb
        shell: bash
        env:
          ONB_GIT_URL: ${{ vars.ONB_GIT_URL }}
          ONB_GIT_REF: ${{ vars.ONB_GIT_REF }}
        run: |
          if [ -z "${ONB_GIT_URL}" ]; then
            echo "::warning title=RAG-less build::ONB_GIT_URL repo variable is not set — skipping the OPTIONAL open-notebook RAG sidecar. This bundle will NOT include RAG / notebook features and is labelled '-norag'. Set ONB_GIT_URL and full-SHA ONB_GIT_REF to ship a full RAG build."
            echo "rag_enabled=false" >> "$GITHUB_OUTPUT"
            echo "RAG_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "${ONB_GIT_REF}" ]; then
            echo "::error title=Open Notebook source is not pinned::ONB_GIT_REF must be set to a full 40-character commit SHA when ONB_GIT_URL is set."
            exit 1
          fi
          if ! printf '%s' "${ONB_GIT_REF}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error title=Open Notebook source is not pinned::ONB_GIT_REF must be a full 40-character commit SHA, not a branch, tag, or short SHA."
            exit 1
          fi
          git clone "${ONB_GIT_URL}" spike/open-notebook
          git -C spike/open-notebook checkout --detach "${ONB_GIT_REF}"
          npm run check:onb-source -- --dir spike/open-notebook --expected "${ONB_GIT_REF}"
          npm run build:onb-binary
          echo "rag_enabled=true" >> "$GITHUB_OUTPUT"
          echo "RAG_ENABLED=true" >> "$GITHUB_ENV"

      # Fail the build NOW (not at user-install time) if a REQUIRED sidecar is
      # missing from the bundle staging dir (OPS-5). Only the LSAT backend is
      # required, so only it gates the release. The OPTIONAL open-notebook
      # resource is intentionally NOT checked here — its absence is a labelled
      # RAG-less build, surfaced in the summary below, not a failure.
      - name: Verify required sidecars are present
        shell: bash
        run: |
          missing=0
          for f in "src-tauri/resources/services/lsat-backend/lsatlab-backend"; do
            if [ -s "$f" ] || [ -s "$f.exe" ]; then
              echo "ok (required): $f"
            else
              echo "::error::required sidecar binary missing: $f"
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - name: Verify sidecar provenance manifest
        run: npm run check:sidecar-provenance

      # OPS-5: record the required-vs-optional outcome in the job summary so the
      # RAG-less build is a deliberate, visible decision rather than a silent gap.
      - name: Sidecar bundle summary (required vs optional)
        if: always()
        shell: bash
        env:
          RAG_ENABLED: ${{ steps.onb.outputs.rag_enabled }}
        run: |
          rag="${RAG_ENABLED:-false}"
          onb_dir="src-tauri/resources/services/open-notebook"
          {
            echo "### Sidecar bundle — ${{ matrix.os }}"
            echo ""
            echo "| Sidecar | Tier | Bundled |"
            echo "| ------- | ---- | ------- |"
            if [ -s "src-tauri/resources/services/lsat-backend/lsatlab-backend" ] || [ -s "src-tauri/resources/services/lsat-backend/lsatlab-backend.exe" ]; then
              echo "| LSAT backend (8100) | REQUIRED | yes |"
            else
              echo "| LSAT backend (8100) | REQUIRED | **MISSING** |"
            fi
            if [ "$rag" = "true" ] && [ -d "$onb_dir" ]; then
              echo "| open-notebook (5055) + worker | OPTIONAL | yes (RAG ON) |"
            else
              echo "| open-notebook (5055) + worker | OPTIONAL | no (RAG OFF — degrades gracefully) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - run: npm run build

      # Decode signing certs from base64 secrets into the runner's cert store.
      - name: Import Windows signing cert
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          Set-Content -Path cert.pfx -Value $bytes -AsByteStream
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item cert.pfx

      - name: Import macOS signing cert
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

      - name: Build Tauri bundle
        env:
          TAURI_WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build ${{ matrix.target-args }}

      - name: Generate release manifest and SBOM evidence
        run: >
          node scripts/release-manifest.mjs write
          --require-assets
          --require-sidecar-provenance
          --output dist/studyvault-release-manifest-${{ matrix.os }}.json

      # OPS-5: a RAG-less build is labelled `-norag` so the artifact (and the
      # downstream Release asset) is unmistakably a deliberate, RAG-disabled
      # bundle. A full build keeps the plain `studyvault-<os>` name.
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: studyvault-${{ matrix.os }}${{ steps.onb.outputs.rag_enabled == 'true' && '' || '-norag' }}
          path: |
            ${{ matrix.artifact-glob }}
            dist/studyvault-release-manifest-${{ matrix.os }}.json
          # audit M20 — fail the build if the installer glob matched nothing
          # (a bad glob / empty Tauri bundle dir) instead of publishing a release
          # with missing installers.
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*
          generate_release_notes: true
          # audit M20 — fail rather than publish a green release whose asset glob
          # matched nothing (paired with if-no-files-found:error on upload above).
          fail_on_unmatched_files: true
