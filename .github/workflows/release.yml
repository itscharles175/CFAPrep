name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps
      - name: Provision LSAT backend
        run: |
          python -m venv .venv-lsat
          .venv-lsat/bin/python -m pip install --upgrade pip wheel
          .venv-lsat/bin/python -m pip install "services/lsat-backend"
      - run: npm run check:versions -- --git-tag
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run typecheck:lsat
      - run: npm run test:ci
      - run: npm run test:lsat:ci
      - run: npm run test:electron
      - run: npm run build
      - run: npm run bundle:report
      - run: npm run perf:regression
      - run: npm run content:validate
      - run: npm run check:no-egress
      - run: npm run check:sidecar-fetches
      - run: npm run check:docs
      - run: npm run check:baselines
      - run: npm run vault-archive:drill
      - name: Prompt Regression Floor
        run: |
          node --import ./scripts/register-ts-loader.mjs scripts/prompt-regression-fixture-floor.mjs
          (cd services/lsat-backend && ../../.venv-lsat/bin/python -m app.prompt_contracts --check)
      - run: node --import ./scripts/register-ts-loader.mjs scripts/rag-eval.mjs
      - run: node --import ./scripts/register-ts-loader.mjs scripts/citation-faithfulness-eval.mjs
      - run: node --import ./scripts/register-ts-loader.mjs scripts/source-grounded-answer-eval.mjs
      - run: node --import ./scripts/register-ts-loader.mjs scripts/generated-content-gate-eval.mjs
      - name: Explanation Golden Floor
        working-directory: services/lsat-backend
        env:
          LSATLAB_DATA_DIR: ${{ runner.temp }}/lsat-explanation-gate
        run: ../../.venv-lsat/bin/python -m app.eval --release-floor --check --seed
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Electron Bundle - ${{ matrix.id }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-x64
            platform: windows
            arch: x64
            artifact-glob: |
              release/*.exe
              release/*.msi
          - os: macos-15
            id: macos-arm64
            platform: macos
            arch: arm64
            artifact-glob: release/*.dmg
          - os: macos-15-intel
            id: macos-x64
            platform: macos
            arch: x64
            artifact-glob: release/*.dmg
          - os: ubuntu-latest
            id: linux-x64
            platform: linux
            arch: x64
            artifact-glob: |
              release/*.AppImage
              release/*.deb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux Packaging Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 rpm xvfb
      - run: npm ci --legacy-peer-deps
      - name: Validate Signing Credentials
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release-signing.mjs preflight --platform ${{ matrix.platform }} --config-output ${{ runner.temp }}/windows-signing-config.json

      - name: Build LSAT Backend Sidecar
        run: npm run build:lsat-binary
      - name: Smoke Test LSAT Backend Sidecar
        shell: bash
        env:
          LSATLAB_DATA_DIR: ${{ runner.temp }}/lsat-smoke
        run: |
          bin="electron/resources/services/lsat-backend/lsatlab-backend"
          if [ -f "${bin}.exe" ]; then bin="${bin}.exe"; fi
          node scripts/smoke-sidecar.mjs \
            --bin "$bin" \
            --url http://127.0.0.1:8123/api/health \
            --expect-ok --timeout 90000 --label lsat-backend \
            -- --host 127.0.0.1 --port 8123

      - name: Build Open Notebook Sidecar (Optional)
        id: onb
        shell: bash
        env:
          ONB_GIT_URL: ${{ vars.ONB_GIT_URL }}
          ONB_GIT_REF: ${{ vars.ONB_GIT_REF }}
        run: |
          if [ -z "${ONB_GIT_URL}" ]; then
            echo "::warning title=RAG-less build::ONB_GIT_URL is unset; this release intentionally omits optional RAG services."
            echo "rag_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "${ONB_GIT_REF}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error title=Open Notebook source is not pinned::ONB_GIT_REF must be a full commit SHA."
            exit 1
          fi
          git clone "${ONB_GIT_URL}" spike/open-notebook
          git -C spike/open-notebook checkout --detach "${ONB_GIT_REF}"
          npm run check:onb-source -- --dir spike/open-notebook --expected "${ONB_GIT_REF}"
          npm run stage:surreal-binary
          npm run build:onb-binary
          npm run check:sidecar-provenance -- --require "SurrealDB" --require "open-notebook binary" --require "open-notebook worker binary"
          echo "rag_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Verify Required Sidecar And Provenance
        shell: bash
        run: |
          bin="electron/resources/services/lsat-backend/lsatlab-backend"
          if [ ! -s "$bin" ] && [ ! -s "${bin}.exe" ]; then
            echo "::error::required LSAT sidecar binary is missing"
            exit 1
          fi
          npm run check:sidecar-provenance

      # win.signtoolOptions.certificateSha1 makes electron-builder resolve the
      # signer from the Windows certificate store, so CSC_LINK is never consulted
      # on this path and the PFX must be imported before the build.
      - name: Import Windows Signing Certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'studyvault-release.pfx'
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $expected = $env:WINDOWS_CERT_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
            if (-not ($imported | Where-Object { $_.Thumbprint -eq $expected })) {
              throw "imported PFX does not contain expected certificate thumbprint $expected"
            }
          } finally {
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          }

      # `--config` REPLACES electron-builder.yml unless the overlay extends it, so
      # assert the MERGED config still carries the packaging invariants (signing
      # enforcement, both Windows targets, sidecar staging, fuse hook) rather than
      # discovering a silently gutted build after the fact.
      - name: Assert Effective Electron Builder Config
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: node scripts/release-signing.mjs assert-config ${{ matrix.platform == 'windows' && format('--config {0}/windows-signing-config.json', runner.temp) || '' }}

      - name: Build Electron Installers
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          CSC_NAME: ${{ matrix.platform == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run electron:build -- --${{ matrix.arch }} ${{ matrix.platform == 'windows' && format('--config {0}/windows-signing-config.json', runner.temp) || '' }}

      - name: Packaged App Smoke
        if: matrix.platform != 'linux'
        run: python scripts/release_local.py _packaged_smoke
      - name: Packaged App Smoke (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum python scripts/release_local.py _packaged_smoke

      - name: Verify Signing Evidence
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release-signing.mjs verify --platform ${{ matrix.platform }} --bundle-root release --output dist/signing-evidence-${{ matrix.id }}.json

      - name: Remove Imported Windows Certificate
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: |
          $expected = "$env:WINDOWS_CERT_THUMBPRINT".Replace(' ', '').ToUpperInvariant()
          if (-not $expected) { return }
          Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint -eq $expected } |
            Remove-Item -Force

      - name: Generate Release Manifest
        env:
          STUDYVAULT_SIGNING_EVIDENCE: ${{ github.workspace }}/dist/signing-evidence-${{ matrix.id }}.json
        run: node scripts/release-manifest.mjs write --require-assets --require-sidecar-provenance ${{ matrix.platform != 'linux' && '--require-signing' || '' }} --output dist/studyvault-release-manifest-${{ matrix.id }}.json

      - name: Sidecar Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Electron bundle - ${{ matrix.id }}"
            echo ""
            echo "| Sidecar | Tier | Bundled |"
            echo "| --- | --- | --- |"
            echo "| LSAT backend (8100) | Required | yes |"
            if [ "${{ steps.onb.outputs.rag_enabled }}" = "true" ]; then
              echo "| Open Notebook (5055) + worker | Optional | yes |"
            else
              echo "| Open Notebook (5055) + worker | Optional | no |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bundles
        uses: actions/upload-artifact@v4
        with:
          name: studyvault-${{ matrix.id }}${{ steps.onb.outputs.rag_enabled == 'true' && '' || '-norag' }}
          path: |
            ${{ matrix.artifact-glob }}
            dist/signing-evidence-${{ matrix.id }}.json
            dist/studyvault-release-manifest-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
