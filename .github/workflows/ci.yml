# J1: StudyVault CI Pipeline
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # DX-2 — single version source-of-truth gate. Fails PRs when package.json,
      # Tauri, Cargo, optional .env, or the backend APP_VERSION default drift.
      - name: Version sync gate
        run: npm run check:versions

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      # TEST-5 (Wave 2 measurement substrate): run the host suite WITH v8 coverage so
      # the non-decreasing coverage floor configured in vite.config.js
      # (`test.coverage.thresholds`) is ENFORCED on every PR — a drop below the floor
      # exits non-zero and fails this job. `npm run test:ci` already emits the JUnit
      # report; `--` forwards `--coverage` through npm to vitest, which adds the v8
      # text + json-summary reporters (the latter uploaded with the other reports
      # below). Offline + hermetic — no sidecar/LLM needed.
      - name: Unit tests (with coverage floor)
        run: npm run test:ci -- --coverage

      - name: Build production bundle
        run: npm run build

      - name: Bundle size report
        run: npm run bundle:report

      - name: Content validation
        run: npm run content:validate

      # GAP-EGRESS-1 — build-time "no-cloud" gate. StudyVault's central invariant
      # is offline-only ("works on a plane"); today that's convention, not a build
      # check, so a stray non-loopback fetch in shipped source (src/ + the LSAT
      # backend app/) would ship green. This static scan FAILS on any non-loopback
      # network egress outside the documented allowlist (the opt-in Anthropic cloud
      # path in cloud.py/config.py + the user-initiated HF research importer). It's
      # node-only — no extra setup — so it runs inline in this job. (Plan GAP-EGRESS-1.)
      - name: No-egress gate
        run: node scripts/check-no-egress.mjs

      # Wave 2 API contract safety - inventory direct frontend fetches to the
      # LSAT sidecar (:8100) that bypass the approved API adapters. The committed
      # baseline is the current debt budget; any NEW direct caller fails CI, and
      # migrated callers can remove their baseline entries to ratchet it down.
      - name: Direct sidecar fetch inventory gate
        run: npm run check:sidecar-fetches

      # DX-1 — docs-drift gate. Verifies docs/ARCHITECTURE.md's load-bearing claims
      # still match the tree: referenced source paths exist, and it doesn't describe
      # the RETIRED split-shell boot path (host-entry.jsx / direct LsatRoot mount)
      # now that src/main.jsx boots the unified <UnifiedRoot>. Minimal + explicit
      # assertions only (no prose linting). node-only, runs inline. (Plan DX-1.)
      - name: Docs-drift gate
        run: node scripts/check-docs-drift.mjs

      # TEST-10 — baseline/golden catalog governance. Ensures every committed or
      # approved external baseline used by CI/release has a documented owner,
      # refresh command, verification command, and generated catalog doc.
      - name: Baseline catalog gate
        run: npm run check:baselines

      # GAP-PORT-1 — restore-onto-clean archive drill. A local-first vault backup
      # is only trustworthy if export -> wipe -> import reproduces source-of-truth
      # stores with matching per-store checksums. This runs fully offline against
      # fake-indexeddb and fails the PR on restore drift.
      - name: Vault archive restore drill
        run: npm run vault-archive:drill

      - name: Prompt regression fixture floor
        run: node --import ./scripts/register-ts-loader.mjs scripts/prompt-regression-fixture-floor.mjs

      # RAG-1 (Wave 2 measurement substrate) — offline retrieval-eval floor.
      # scripts/rag-eval.mjs computes recall@k / precision@k / MRR / nDCG over
      # committed golden fixtures and FAILS if any metric drops below the
      # documented floor, so a retrieval regression can't ship green. node-only.
      - name: RAG retrieval-eval floor
        run: node --import ./scripts/register-ts-loader.mjs scripts/rag-eval.mjs

      - name: Citation faithfulness floor
        run: node --import ./scripts/register-ts-loader.mjs scripts/citation-faithfulness-eval.mjs

      - name: Source-grounded answer benchmark floor
        run: node --import ./scripts/register-ts-loader.mjs scripts/source-grounded-answer-eval.mjs

      - name: Generated content gate floor
        run: node --import ./scripts/register-ts-loader.mjs scripts/generated-content-gate-eval.mjs

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            !dist/source-vault/**
            !**/*.qvsource
            !**/*.pdf
            !**/*.epub
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            dist/reports/
            !**/*.qvsource
            !**/*.pdf
            !**/*.epub
          retention-days: 14

  # UC2: WCAG AA contrast gate. Builds the production bundle, installs the
  # Playwright-managed Chromium, then runs scripts/a11y-check.mjs (npm run
  # a11y:check) — a broad WCAG 2.1 A/AA axe sweep across every screenshot route
  # in BOTH light and dark themes, plus a focused color-contrast pass over the
  # UI primitives (the /style gallery), chart SVGs (/analytics, /knowledge-graph),
  # and the per-domain light-mode accents (/cfa, /excel, /quant in light theme).
  # The script exits non-zero on any AA violation, so contrast regressions fail
  # CI. Runs in parallel with `quality` — no host slowdown. (Plan UC2.)
  a11y:
    name: Accessibility — WCAG AA contrast (light + dark)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # a11y:check launches headless Chromium via playwright-core. There is no
      # system browser on the runner, so install Playwright's managed Chromium
      # (with its Linux system libs); a11y-helpers.mjs resolves it via
      # chromium.executablePath().
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: WCAG AA contrast check
        run: npm run a11y:check

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-a11y
          path: |
            dist/reports/a11y-check.json
          retention-days: 14

  # UA7: design-token visual-regression net. Builds the production bundle,
  # installs the Playwright-managed Chromium, then runs scripts/visual-regression.mjs
  # (npm run visual:regression) — it screenshots a curated set of routes (incl.
  # the /style token gallery) in BOTH light and dark themes and pixel-diffs each
  # frame against the approved baselines under tests/visual-baselines/. Missing
  # baselines fail before Chromium launches; intentional rebaselines require
  # UPDATE_VISUAL_BASELINES=1 in a controlled run. Screenshots + diffs are
  # uploaded as an artifact for review. Runs in parallel with `quality` — no
  # host slowdown. (Plan UA7.)
  visual:
    name: Visual regression — token gallery + routes (light + dark)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # audit M19 — restore Linux-generated visual baselines so the gate enforces
      # changed shots after the first approved cache seed. A true cache miss on a
      # new repo/branch bootstraps the initial Linux frames, while restore-key hits
      # still compare against the previous approved set and fail on drift.
      - name: Restore visual baselines
        id: visual-baselines-cache
        uses: actions/cache@v4
        with:
          path: tests/visual-baselines
          key: visual-baselines-${{ runner.os }}-${{ hashFiles('src/routes/routeManifest.ts', 'src/styles/tokens.css', 'src/index.css') }}
          restore-keys: |
            visual-baselines-${{ runner.os }}-

      - name: Bootstrap visual baselines on cache miss
        if: steps.visual-baselines-cache.outputs.cache-hit == ''
        run: echo "::warning title=Visual baseline cache miss::No approved visual baseline cache was restored; this run will write the initial Linux baselines and save them for subsequent enforcement."

      # visual:regression launches headless Chromium via playwright-core. There is
      # no system browser on the runner, so install Playwright's managed Chromium
      # (with its Linux system libs); a11y-helpers.mjs resolves it via
      # chromium.executablePath().
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      # audit H5 — the offline/PWA regression suite (service-worker readiness,
      # offline reload, offline deep-routes, PWA update prompt) — the gate for this
      # offline-first app's CENTRAL invariant — was never invoked by any workflow,
      # so a broken SW or update path could ship green. Run it here, reusing this
      # job's production build + Playwright Chromium. (Audit H5.)
      - name: Offline + PWA regression
        run: npm run browser:regression

      - name: Visual regression check
        env:
          UPDATE_VISUAL_BASELINES: ${{ steps.visual-baselines-cache.outputs.cache-hit == '' && '1' || '0' }}
        run: npm run visual:regression

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-visual
          path: |
            dist/reports/visual/
            dist/reports/visual-regression.json
          retention-days: 14

  # TEST-7 / Wave 10: route-level runtime performance budget. Builds the
  # production bundle, launches the same preview/Chromium stack as visual/a11y,
  # and measures cold + warm navigations for the host home, CFA dashboard, CFA
  # exam/practice routes, and stable /lsat routes across desktop + mobile
  # viewports. The committed tests/performance-baseline.json is conservative at
  # first and can be ratcheted after stable CI evidence; missing LCP/CLS/TBT/FCP
  # metrics or large regressions fail the job. (TEST-7, Wave 10.)
  perf:
    name: Runtime performance — route budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Route performance budget
        run: npm run perf:regression

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-perf
          path: |
            dist/reports/perf-regression.json
          retention-days: 14

  # QA-1 / K4-0: the /lsat/* routes in the visual + a11y gates. The vendored LSAT
  # domain is served by the SAME production build (src/main.jsx mounts it under a
  # `<BrowserRouter basename="/lsat">`), so this job builds once, installs the
  # Playwright-managed Chromium (as `a11y` / `visual` do), then re-runs the SAME
  # two gate scripts scoped to LSAT via INCLUDE_LSAT_ROUTES=1 + LSAT_ROUTES_ONLY=1
  # (scripts/qa-helpers.mjs `selectGateRoutes`): the visual gate screenshots each
  # LSAT route in BOTH themes × BOTH viewports (K4-0) and the a11y gate runs the
  # WCAG 2.1 A/AA sweep + the LSAT contrast matrix. Approved Linux baselines are
  # restored from cache after the first cache-seeding run. Runs in parallel with
  # `quality` — no host slowdown. (Roadmap QA-1 + K4-0/K4-1.)
  lsat-qa-gates:
    name: LSAT routes — visual + a11y (light + dark, desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      INCLUDE_LSAT_ROUTES: '1'
      LSAT_ROUTES_ONLY: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore LSAT visual baselines
        id: lsat-visual-baselines-cache
        uses: actions/cache@v4
        with:
          path: tests/visual-baselines
          key: lsat-visual-baselines-${{ runner.os }}-${{ hashFiles('src/domains/lsat/lib/routeManifest.ts', 'src/routes/routeManifest.ts', 'src/styles/tokens.css', 'src/index.css') }}
          restore-keys: |
            lsat-visual-baselines-${{ runner.os }}-

      - name: Bootstrap LSAT visual baselines on cache miss
        if: steps.lsat-visual-baselines-cache.outputs.cache-hit == ''
        run: echo "::warning title=LSAT visual baseline cache miss::No approved LSAT visual baseline cache was restored; this run will write the initial Linux baselines and save them for subsequent enforcement."

      # Both gates launch headless Chromium via playwright-core; there is no
      # system browser on the runner, so install Playwright's managed Chromium
      # (with its Linux system libs) — a11y-helpers.mjs resolves it via
      # chromium.executablePath().
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Visual regression check (LSAT routes)
        env:
          UPDATE_VISUAL_BASELINES: ${{ steps.lsat-visual-baselines-cache.outputs.cache-hit == '' && '1' || '0' }}
        run: npm run visual:regression

      - name: WCAG AA contrast check (LSAT routes)
        run: npm run a11y:check

      - name: Upload LSAT QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-lsat-qa
          path: |
            dist/reports/visual/
            dist/reports/visual-regression.json
            dist/reports/a11y-check.json
          retention-days: 14

  # QA-3: PR-gate sidecar smoke + OpenAPI contract drift. The binary smoke in
  # release.yml only runs on a tag (against the FROZEN PyInstaller binary), so a
  # PR that breaks the host↔sidecar boundary isn't caught until release. This job
  # closes that gap WITHOUT freezing a binary (too slow for every PR): it boots
  # the LSAT backend FROM SOURCE in an isolated `.venv-lsat` (the same venv layout
  # build-lsat-binary.mjs provisions) and exercises three legs —
  #   1. the DATA-1 contract drift gate (export-lsat-openapi.mjs --check) against
  #      services/lsat-backend/openapi-baseline.json — fails on any removed
  #      path/method/2xx field across the WHOLE spec;
  #   2. scripts/smoke-sidecar.mjs booting `sidecar_main.py` (the production entry)
  #      and asserting GET /api/health → {ok:true};
  #   3. a second smoke boot asserting GET /api/srs/due returns 2xx JSON (the
  #      host's SRS queue read — the route DATA-1 calls out by name).
  # The per-route response-schema field-removal snapshot
  # (services/lsat-backend/tests/schemas-baseline.json) runs inside the backend
  # pytest gate in this same job. LSATLAB_DATA_DIR points at a runner-temp dir so
  # the first-run SQLite create + startup backup can't fail on perms; the startup
  # model probe fails fast (no Ollama in CI) and the app keeps serving. Runs in
  # parallel with `quality` — no host slowdown. (Roadmap QA-3, DATA-1.)
  lsat-sidecar-smoke:
    name: LSAT sidecar — smoke + OpenAPI contract (from source)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Provision the isolated backend venv at the repo root exactly where
      # build-lsat-binary.mjs / export-lsat-openapi.mjs expect it (`.venv-lsat`),
      # installing the backend from its own pyproject so the runtime deps are the
      # authoritative set. The drift script resolves `.venv-lsat/bin/python`
      # itself; the smoke steps reference it explicitly.
      - name: Provision LSAT backend venv
        run: |
          python -m venv .venv-lsat
          .venv-lsat/bin/python -m pip install --upgrade pip wheel
          .venv-lsat/bin/python -m pip install "services/lsat-backend"
          .venv-lsat/bin/python -m pip install "pytest>=9.0.3"

      # Leg 1 — DATA-1 whole-spec contract drift gate. Imports the FastAPI app
      # in-process via the backend interpreter and diffs app.openapi() against the
      # committed baseline; fails on any removed path/method/2xx response field.
      - name: OpenAPI contract drift check
        run: node scripts/export-lsat-openapi.mjs --check

      # audit M18 — CLIENT-drift gate. The check above only diffs live-vs-baseline
      # (backend side); this fails when the committed typed client (its codegen
      # input src/domains/lsat/_meta/openapi.json + api.gen.ts) is BEHIND the live
      # backend — the gap that let the client silently rot 41 paths behind, so a
      # backend field rename on those routes shipped green and only broke at runtime.
      - name: Client contract drift check
        run: node scripts/export-lsat-openapi.mjs --client

      # Per-route response-schema field-removal snapshot (QA-3) runs in the
      # backend's own pytest gate, alongside the launch-readiness contract asserts.
      - name: Backend OpenAPI contract tests
        working-directory: services/lsat-backend
        run: ../../.venv-lsat/bin/python -m pytest tests/test_openapi_contract.py -q

      # Leg 2 — boot the backend FROM SOURCE (production entry: sidecar_main.py)
      # and assert GET /api/health → {ok:true}. `app` is installed into the venv,
      # so the import resolves regardless of cwd. LSATLAB_DATA_DIR keeps the
      # first-run SQLite/backup writes in a throwaway dir.
      - name: Smoke — /api/health
        env:
          LSATLAB_DATA_DIR: ${{ runner.temp }}/lsat-source-smoke
        run: |
          node scripts/smoke-sidecar.mjs \
            --bin .venv-lsat/bin/python \
            --url http://127.0.0.1:8123/api/health \
            --expect-ok --timeout 90000 --label lsat-backend-src \
            -- services/lsat-backend/sidecar_main.py --host 127.0.0.1 --port 8123

      # Leg 3 — second boot, assert GET /api/srs/due returns 2xx JSON (the host's
      # SRS queue read). No --expect-ok: this route's body isn't the {ok:bool}
      # health envelope, so a plain 2xx is the contract here.
      - name: Smoke — /api/srs/due
        env:
          LSATLAB_DATA_DIR: ${{ runner.temp }}/lsat-source-smoke
        run: |
          node scripts/smoke-sidecar.mjs \
            --bin .venv-lsat/bin/python \
            --url http://127.0.0.1:8123/api/srs/due \
            --timeout 90000 --label lsat-srs-due \
            -- services/lsat-backend/sidecar_main.py --host 127.0.0.1 --port 8123

  # The vendored LSAT subtree runs on the host's hoisted toolchain (no separate
  # node_modules) but is excluded from the host's strict tsc + the default
  # `npm test`. This parallel job is its safety net: 251 tests + a strict
  # type-check via tsconfig.lsat.json. Runs alongside `quality` — no host
  # slowdown. (Plan S2.)
  lsat-quality:
    name: LSAT subtree — Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check (LSAT subtree)
        run: npm run typecheck:lsat

      - name: LSAT unit tests
        run: npm run test:lsat:ci

      - name: Upload LSAT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-lsat
          path: |
            dist/reports/
            !**/*.qvsource
            !**/*.pdf
            !**/*.epub
          retention-days: 14

  # TEST-1: the FULL LSAT backend pytest suite. Before this, only the OpenAPI
  # contract test ran in the `lsat-sidecar-smoke` job — ~90 mature test files
  # (schema/seed, SRS, generation gates, import, migrations, analytics, the
  # provenance-safe MCP tools, …) sat dark, so a backend regression shipped green.
  # This job provisions the same isolated `.venv-lsat` the sidecar jobs use,
  # installs the backend FROM ITS pyproject (so `mcp`, `fsrs`, `sqlite-vec`, … —
  # the authoritative runtime set — are present) plus the dev test tools, and runs
  # pytest over the whole `tests/` tree. The live-provider tests (test_live_ollama,
  # the realtime LMStudio leg) self-skip via `@pytest.mark.skipif(not _ollama_up())`
  # when no model server is reachable — which is always true in CI — so no broad
  # skip is needed and the `mcp` tools (mcp is a hard dependency, hence installed)
  # run for real. Runs in parallel with `quality` — no host slowdown. (Plan TEST-1.)
  lsat-backend-tests:
    name: LSAT backend — full pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      LSATLAB_DATA_DIR: /tmp/lsat-backend-tests
      LSATLAB_OLLAMA_URL: http://127.0.0.1:1
      LSATLAB_LMSTUDIO_URL: http://127.0.0.1:1/v1
      LSATLAB_LLM_RETRIES: '0'
      LSATLAB_LOCAL_PROVIDER: ollama
      LSATLAB_GEN_PROVIDER: ollama
      LSATLAB_ENFORCE_OFFLINE: '0'
      LSATLAB_CLOUD_EGRESS_ALLOWED: '0'
      LSATLAB_CLOUD_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      LSATLAB_ALLOW_REMOTE_LLM: '0'
      LSATLAB_JOBS_WORKER: '0'
      LSATLAB_ERRORLOG_AUTODIAGNOSE: '0'
      LSATLAB_IMPORT_EMBED_ON_COMMIT: '0'
      LSATLAB_GEN_PERMUTATION_SC: '0'
      LSATLAB_GEN_INFORMATIVITY_CHECK: '0'
      LSATLAB_GEN_DISTRACTOR_QUALITY_CHECK: '0'
      LSATLAB_GEN_MULTI_MODEL_AGREEMENT: '0'
      LSATLAB_SQLITE_FK: '0'
      UPDATE_SCHEMA_BASELINE: '0'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: 127.0.0.1,localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same venv layout (`.venv-lsat` at the repo root) the sidecar-smoke +
      # OpenAPI-drift jobs provision, so the backend resolves `app` identically.
      # The backend declares its runtime deps in pyproject (no requirements*.txt),
      # so install the package itself for those; add the dev test tools
      # (pytest/hypothesis/pytest-cov from the pyproject `dev` dependency-group)
      # explicitly, since plain pip doesn't read PEP-735 groups on older versions.
      - name: Provision LSAT backend venv
        run: |
          python -m venv .venv-lsat
          .venv-lsat/bin/python -m pip install --upgrade pip wheel
          .venv-lsat/bin/python -m pip install "services/lsat-backend"
          .venv-lsat/bin/python -m pip install \
            "pytest>=9.0.3" "pytest-cov>=7.1.0" "hypothesis>=6.152.9"

      # Run the entire suite from the backend dir so `app` + tests/conftest
      # resolve. The job env pins live model endpoints to closed loopback ports,
      # disables worker/autodiagnosis side effects, and keeps cloud egress closed.
      # Coverage is a real ratchet now: the current measured baseline is 85.85%,
      # so CI enforces an 85% floor and uploads machine-readable reports.
      - name: Backend pytest (full suite + coverage floor)
        working-directory: services/lsat-backend
        run: |
          mkdir -p ../../dist/reports
          ../../.venv-lsat/bin/python -m pytest \
            -q -p no:cacheprovider --strict-config --durations=25 \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:../../dist/reports/lsat-backend-coverage.xml \
            --cov-report=json:../../dist/reports/lsat-backend-coverage.json \
            --cov-fail-under=85

      - name: Explanation golden floor
        working-directory: services/lsat-backend
        env:
          LSATLAB_DATA_DIR: ${{ runner.temp }}/lsat-explanation-gate
        run: ../../.venv-lsat/bin/python -m app.eval --release-floor --check --seed

      - name: Backend prompt regression fixture floor
        working-directory: services/lsat-backend
        run: ../../.venv-lsat/bin/python -m app.prompt_contracts --check

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-lsat-backend-coverage
          path: |
            dist/reports/lsat-backend-coverage.xml
            dist/reports/lsat-backend-coverage.json
          retention-days: 14

  # TEST-2: the Tauri Rust core (src-tauri/) — compile, test, lint, format. The
  # Rust supervisor (sidecar lifecycle, Job-Object cleanup, data relocation) had
  # NO CI: `cargo test` only ran inside the tagged release bundle, so a broken
  # supervisor surfaced at release, not on the PR. This job is WINDOWS-primary —
  # the desktop app's main target, where the Job-Object + path logic is
  # platform-specific — and runs the standard Rust gate: fmt --check, clippy
  # (warnings = errors), and the unit tests in lib.rs + relocation.rs. WebView2
  # is preinstalled on the windows runner, so the `tauri` crate links. Runs in
  # parallel with `quality` — no host slowdown. (Plan TEST-2.)
  tauri-rust:
    name: Tauri Rust core — fmt + clippy + test (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy (warnings as errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --all-features
