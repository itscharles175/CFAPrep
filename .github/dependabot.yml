version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    # Dependency vulnerabilities remain enforced by the CI audit gate. Keep the
    # ecosystem inventory without allowing version-update branches or PRs.
    open-pull-requests-limit: 0
    groups:
      runtime:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - dexie
      build-tooling:
        patterns:
          - vite
          - '@vitejs/*'
          - vite-plugin-pwa
          - typescript
          - vitest
      test-and-lint:
        patterns:
          - eslint
          - '@eslint/*'
          - '@testing-library/*'
          - playwright-core
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 0
