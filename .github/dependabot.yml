version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - dexie
      build-tooling:
        patterns:
          - vite
          - "@vitejs/*"
          - vite-plugin-pwa
          - typescript
          - vitest
      test-and-lint:
        patterns:
          - eslint
          - "@eslint/*"
          - "@testing-library/*"
          - playwright-core
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
